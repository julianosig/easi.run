<!doctype html>
<html>
<head><meta charset="utf-8"><title data-t="upload.title"></title><link rel="stylesheet" href="/shared/demo.css"></head>
<body>
<main>
  <div class="card">
    <h1 data-t="upload.heading"></h1>
    <p class="lead" data-t="upload.lead"></p>
    <button type="button" id="choose" data-t="upload.choose"></button>
    <input id="pick" type="file" multiple hidden>
    <ul class="files" id="files"></ul>
  </div>
  <p class="hint" data-t="upload.hint"></p>
</main>
<script type="module">
  import { t } from '/shared/words.js';
  import { formatSize } from '/shared/format.js';
  document.getElementById('choose').addEventListener('click', () => document.getElementById('pick').click());
  document.getElementById('pick').addEventListener('change', (e) => {
    const list = document.getElementById('files');
    for (const file of e.target.files) {
      const li = document.createElement('li');
      li.innerHTML = '<span></span><span class="ok"></span>';
      li.firstChild.textContent = `${file.name} · ${formatSize(file.size)}`;
      li.lastChild.textContent = t('upload.attached');
      list.prepend(li);
    }
  });
</script>
</body>
</html>
