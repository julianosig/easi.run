<!doctype html>
<html>
<head><meta charset="utf-8"><title data-t="clipboard.title"></title><link rel="stylesheet" href="/shared/demo.css"></head>
<body>
<main>
  <div class="card">
    <h1 data-t="clipboard.copyHeading"></h1>
    <p class="lead" data-t="clipboard.copyLead"></p>
    <div class="row">
      <code class="big" id="coupon">EASI-RUN-2026</code>
      <button id="copy" data-t="clipboard.copy"></button>
      <span id="copied" class="ok" role="status"></span>
    </div>
  </div>
  <div class="card" style="margin-top:16px">
    <h1 data-t="clipboard.pasteHeading"></h1>
    <p class="lead" data-t="clipboard.pasteLead"></p>
    <textarea id="paste" spellcheck="false" autocomplete="off" data-placeholder="clipboard.paste"></textarea>
    <p class="hint" id="pasted" role="status" style="margin-top:8px"></p>
  </div>
  <p class="hint" data-t="clipboard.hint"></p>
</main>
<script type="module">
  import { t } from '/shared/words.js';
  // Everything stays in this page: no request is ever sent.
  const code = document.getElementById('coupon').textContent, done = document.getElementById('copied');
  document.getElementById('copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(code);
    } catch {
      // Older path, still a copy the browser reports.
      const range = document.createRange();
      range.selectNodeContents(document.getElementById('coupon'));
      getSelection().removeAllRanges();
      getSelection().addRange(range);
      if (!document.execCommand('copy')) { done.textContent = t('clipboard.refused'); return; }
      getSelection().removeAllRanges();
    }
    done.textContent = t('clipboard.copied');
    setTimeout(() => (done.textContent = ''), 2500);
  });
  document.getElementById('paste').addEventListener('paste', (e) => {
    const text = e.clipboardData?.getData('text/plain') ?? '';
    document.getElementById('pasted').textContent = text ? t('clipboard.pasted', { count: text.length }) : '';
  });
</script>
</body>
</html>
