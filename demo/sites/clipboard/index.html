<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Copy & paste · easi.run demo</title><link rel="stylesheet" href="/shared/demo.css"></head>
<body>
<main>
  <div class="card">
    <h1>Copy from the page</h1>
    <p class="lead">Press Copy, then paste anywhere on your computer.</p>
    <div class="row">
      <code class="big" id="coupon">EASI-RUN-2026</code>
      <button id="copy">Copy</button>
      <span id="copied" class="ok" role="status"></span>
    </div>
  </div>
  <div class="card" style="margin-top:16px">
    <h1>Paste into the page</h1>
    <p class="lead">Copy any text on your computer, click the box and paste (Ctrl+V or ⌘V).</p>
    <textarea id="paste" spellcheck="false" autocomplete="off" placeholder="Paste here…"></textarea>
    <p class="hint" id="pasted" role="status" style="margin-top:8px"></p>
  </div>
  <p class="hint">In easi.run, what you paste while you hold control (4+ characters, unchanged) reaches the AI as [redacted].</p>
</main>
<script>
  // Everything stays in this page: no request is ever sent.
  const code = document.getElementById('coupon').textContent, done = document.getElementById('copied');
  document.getElementById('copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(code);
    } catch {
      // Older path, still a copy the browser reports.
      const range = document.createRange();
      range.selectNodeContents(document.getElementById('coupon'));
      getSelection().removeAllRanges();
      getSelection().addRange(range);
      if (!document.execCommand('copy')) { done.textContent = 'The browser refused the copy'; return; }
      getSelection().removeAllRanges();
    }
    done.textContent = 'Copied ✓';
    setTimeout(() => (done.textContent = ''), 2500);
  });
  document.getElementById('paste').addEventListener('paste', (e) => {
    const text = e.clipboardData?.getData('text/plain') ?? '';
    document.getElementById('pasted').textContent = text ? `Pasted ${text.length} characters from your computer ✓` : '';
  });
</script>
</body>
</html>
