<!doctype html>
<html>
<head><meta charset="utf-8"><title data-t="typing.title"></title><link rel="stylesheet" href="/shared/demo.css">
<style>
  .target { margin: 0 0 16px; padding: 16px 18px; border-radius: 12px; background: var(--wash); font-size: 20px; line-height: 1.6; }
  .target .hit { color: var(--blue); }
  .target .miss { color: #fff; background: var(--coral); border-radius: 3px; }
  .target .next { border-left: 2px solid var(--ink); }
  .stats { display: flex; gap: 10px; margin-top: 16px; }
</style></head>
<body>
<main>
  <div class="card">
    <h1 data-t="typing.heading"></h1>
    <p class="lead" data-t="typing.lead"></p>
    <p class="target" id="target"></p>
    <label for="input" data-t="typing.label"></label>
    <textarea id="input" spellcheck="false" autocomplete="off" data-placeholder="typing.placeholder"></textarea>
    <div class="stats">
      <div class="stat"><b id="wpm">0</b><span data-t="typing.speed"></span></div>
      <div class="stat"><b id="accuracy">100%</b><span data-t="typing.accuracy"></span></div>
      <button class="ghost" id="again" style="margin:0 0 0 auto" data-t="typing.again"></button>
    </div>
  </div>
  <p class="hint" data-t="typing.hint"></p>
</main>
<script type="module">
  import { t } from '/shared/words.js';
  // Everything stays in this page: no request is ever sent.
  const sentences = t('typing.sentences');
  // The characters one counted unit stands for: five a word, or one where the language counts characters.
  const perWord = t('typing.perWord');
  const target = document.getElementById('target'), input = document.getElementById('input');
  let text = sentences[0], started = null;
  function render() {
    const value = input.value;
    // Accuracy is what the sentence shows: each character typed against the one under it, any past its end wrong.
    const right = value.split('').filter((ch, i) => ch === text[i]).length;
    target.replaceChildren(...[...text].map((ch, i) => {
      const s = document.createElement('span');
      s.textContent = ch;
      if (i < value.length) s.className = value[i] === ch ? 'hit' : 'miss';
      else if (i === value.length) s.className = 'next';
      return s;
    }));
    const minutes = started ? (Date.now() - started) / 60000 : 0;
    document.getElementById('wpm').textContent = minutes > 0 ? Math.round(value.length / perWord / minutes) : 0;
    document.getElementById('accuracy').textContent = `${value ? Math.round(100 * right / value.length) : 100}%`;
  }
  input.addEventListener('input', () => {
    started ??= Date.now();
    render();
  });
  document.getElementById('again').addEventListener('click', () => {
    text = sentences[(sentences.indexOf(text) + 1) % sentences.length];
    input.value = '';
    started = null;
    render();
    input.focus();
  });
  render();
</script>
</body>
</html>
