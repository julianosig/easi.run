# The demo's walled garden: every destination a demo browser asks for comes here (the session proxy sends it, whatever
# the name). The demo hosts get their pages; any other name is sent back home — to the demo the visitor came
# from, or the takeover demo. One self-signed certificate serves every name; Chrome accepts it by its pinned SPKI.
# The demo hostnames are listed in demo/compose.yaml (ADMIN_DEMO_SITES), demo/nginx.conf, demo/sites-cert.sh and
# client/src/ui/demos.ts (and each has a directory under demo/sites/): scripts/demo.py checks that they agree.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log off;
  client_max_body_size 1k;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  ssl_certificate /etc/demo/cert.pem;
  ssl_certificate_key /etc/demo/key.pem;

  # Home is the demo the request came from, when it came from one.
  map $http_referer $home {
    ~^https://(?<demo>takeover|drag|upload|download|sound|typing|clipboard)\.play/ https://$demo.play/;
    default https://takeover.play/;
  }

  server {
    listen 80 default_server;
    return 302 $home;
  }

  server {
    listen 443 ssl default_server;
    return 302 $home;
  }

  server {
    listen 443 ssl;
    server_name ~^(?<demo>takeover|drag|upload|download|sound|typing|clipboard)\.play$;
    root /srv/sites/$demo;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /shared/ {
      root /srv/sites;
    }
    location /files/ {
      # A location's add_header replaces the server's, so it repeats them.
      add_header Content-Disposition "attachment" always;
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
      try_files $uri $uri/index.html @home;
    }
    location @home {
      return 302 https://$demo.play/;
    }
  }
}
