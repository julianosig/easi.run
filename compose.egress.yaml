# Sessions may leave through the deployment's upstream proxies (a residential or ISP proxy, say) instead of directly:
#   DOCKER_GID=$(stat -c %g /var/run/docker.sock) docker compose -f compose.yaml -f compose.egress.yaml up -d
# The file (EGRESS_FILE, default ./egress.json; its format is in admin/src/egresses.rs) holds the proxies' credentials,
# so make it the admin's alone: sudo chown 10004 egress.json && sudo chmod 0400 egress.json. The admin refuses a file
# owned by anyone but its uid or root, writable by its group, or usable by others, and does not start with a malformed
# one. The person then picks an egress per session.
services:
  admin:
    environment:
      ADMIN_EGRESS_FILE: /run/egress.json
    volumes:
      - ${EGRESS_FILE:-./egress.json}:/run/egress.json:ro
