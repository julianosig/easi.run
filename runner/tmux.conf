# The terminal keeps the program running with no viewer, and is otherwise out of its way: no status line, no prefix
# key, every key the program's. The wheel scrolls its history; Shift and the mouse select in the browser.
set -g status off
set -g prefix None
unbind C-b
set -g mouse on
set -g history-limit 20000
set -sg escape-time 0
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:clipboard"
set -g set-clipboard on
