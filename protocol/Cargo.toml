[package]
name = "display-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The operator's logo (see `logo`), which the controller and the display check.
logo = ["dep:base64", "dep:miniz_oxide", "dep:png"]

[dependencies]
base64 = { version = "0.22", optional = true }
# The inflater the png crate uses, which the logo's own exact checks call too.
miniz_oxide = { version = "0.8", optional = true }
png = { version = "0.18", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
flate2 = "1"

[lints]
workspace = true
