# easi.run. install.sh at the repository root installs it (https://easi.run/install.sh). By hand, start it with:
#   DOCKER_GID=$(stat -c %g /var/run/docker.sock) docker compose up --build
# then open https://localhost:9443 and create the admin's password there.
#
# Only `admin` and `controller` run for the life of the installation; `init` runs only when asked. The controller creates each browser session's
# display, proxy, browser, and agent containers from fixed templates (docs/topology.md); the four `*-image` services
# below only build those images (scale 0: no container). compose.bench.yaml adds the KasmVNC baseline.
name: easi-run

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  restart: unless-stopped
  # Rotated, as the controller requires of every session container: no log can fill the host's disk.
  logging: { driver: local, options: { max-size: 10m, max-file: "3" } }
  # A core limit of 1, which the kernel takes as no core dump at all: no core file, and nothing piped to a collector.
  # The admin and the controller are non-dumpable too.
  ulimits: { core: 1 }

services:
  admin:
    <<: *hardening
    build: { context: ., target: admin }
    image: easi-run/admin:dev
    user: "10004:10014"
    group_add: ["10015"]
    environment:
      ADMIN_ORIGIN: "https://localhost:${ADMIN_PORT:-9443}"
      ADMIN_HOSTNAMES: "localhost,127.0.0.1"
      # Where the browsers say they are; match them to where their traffic leaves.
      ADMIN_TIMEZONE: "${ADMIN_TIMEZONE:-UTC}"
      ADMIN_LANGUAGES: "${ADMIN_LANGUAGES:-en-US,en}"
      # Browser sessions at once, 1 to 16. One by default, which fits a 4 GB server: each takes up to BROWSER_MEMORY_MIB
      # for its browser and 1152 MiB for its display, agent and proxy.
      ADMIN_MAX_SESSIONS: "${ADMIN_MAX_SESSIONS:-1}"
      # The local MCP socket for `docker exec -i easi-run-admin-1 admin mcp`; 0 turns it off.
      ADMIN_LOCAL_MCP: "${ADMIN_LOCAL_MCP:-1}"
    ports: ["127.0.0.1:${ADMIN_PORT:-9443}:9443"]
    volumes:
      - admin-state:/var/lib/admin
      - streams:/run/streams
      - controller:/run/controller
    networks: [admin]
    mem_limit: 256m
    # No swap: the saved profiles' key, while unlocked, and a profile streaming through stay in memory.
    memswap_limit: 256m
    cpus: 1
    pids_limit: 512
    depends_on: [controller]

  # `admin init`: sets the admin's password from stdin unless one is set, in the admin's own state volume. A one-off,
  # never started by `up` (its profile) or restarted, with no network and no log, so the password reaches no log:
  #   docker compose run --rm -T --no-deps init < password-file
  # (exit 0 when the password is the one given, set now or already; 3 when another one is set). The admin image must be built first.
  init:
    image: easi-run/admin:dev
    pull_policy: never
    profiles: [init]
    entrypoint: ["/usr/local/bin/admin", "init"]
    user: "10004:10014"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    restart: "no"
    logging: { driver: none }
    volumes:
      - admin-state:/var/lib/admin
    mem_limit: 256m
    cpus: 1
    pids_limit: 64
    ulimits: { core: 1 }

  controller:
    <<: *hardening
    build: { context: ., target: controller }
    image: easi-run/controller:dev
    user: "10006:10015"
    # The Docker socket's group: DOCKER_GID=$(stat -c %g /var/run/docker.sock). Without it the controller cannot reach Docker.
    group_add: ["${DOCKER_GID:-65534}"]
    network_mode: none
    environment:
      IMAGE_DISPLAY: easi-run/display:dev
      IMAGE_BROWSER: easi-run/browser:dev
      IMAGE_AGENT: easi-run/agent:dev
      IMAGE_PROXY: easi-run/proxy:dev
      STREAMS_VOLUME: easi-run-streams
      # Each browser session's limits; the defaults are the measured balance (docs/benchmark.md#browser-limits).
      CONTROLLER_BROWSER_CPUS: ${BROWSER_CPUS:-2}
      CONTROLLER_BROWSER_MEMORY_MIB: ${BROWSER_MEMORY_MIB:-2048}
      # The admin's ADMIN_MAX_SESSIONS: no more sessions exist, whatever the admin asks.
      CONTROLLER_MAX_SESSIONS: "${ADMIN_MAX_SESSIONS:-1}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - controller:/run/controller
    mem_limit: 128m
    # No swap: a saved profile streams through it, in the clear.
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 128
    depends_on: [display-image, browser-image, agent-image, proxy-image]

  display-image:
    build: { context: ., dockerfile: display/Dockerfile }
    image: easi-run/display:dev
    scale: 0
  browser-image:
    build: { context: ., target: browser }
    image: easi-run/browser:dev
    scale: 0
  agent-image:
    build: { context: ., target: agent }
    image: easi-run/agent:dev
    scale: 0
  proxy-image:
    build: { context: ., target: proxy }
    image: easi-run/proxy:dev
    scale: 0

networks:
  admin: {}

volumes:
  admin-state: {}
  streams:
    name: easi-run-streams
    driver_opts: { type: tmpfs, device: tmpfs, o: "uid=10004,gid=10014,mode=2770,noexec,nosuid,nodev,size=16m" }
  controller:
    driver_opts: { type: tmpfs, device: tmpfs, o: "uid=10006,gid=10015,mode=0770,noexec,nosuid,nodev,size=1m" }
