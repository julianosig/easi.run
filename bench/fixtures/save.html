<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Save</title>
<style>body{margin:40px;font:18px system-ui,sans-serif}</style></head>
<body><p id="state">Click to save a file.</p>
<script>
// A click saves "notas.txt" through the page's own save dialog (the file chooser portal's SaveFile), with known bytes,
// once. The page notes the outcome either way ("Saved.", or "save refused: NAME: MESSAGE"), so a test can tell a save it
// tried, and why it was refused. A refused save is tried again at the next click, as a person would click again: on a
// loaded host Chrome may refuse one for want of the click's user activation, which reaches its browser process after
// the page's request.
let saving = false;
document.addEventListener('pointerdown', async () => {
  if (saving) return;
  saving = true;
  const state = document.getElementById('state');
  try {
    const handle = await showSaveFilePicker({ suggestedName: 'notas.txt' });
    const writable = await handle.createWritable();
    await writable.write('Notas salvas: ' + 'ação '.repeat(1000));
    await writable.close();
    state.textContent = 'Saved.';
  } catch (e) {
    state.textContent = `save refused: ${e.name}: ${e.message}`;
    saving = false;
  }
});
</script></body></html>
