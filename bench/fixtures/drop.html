<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Drop zone</title>
<style>html,body{margin:0;height:100%;overflow:hidden;font:18px system-ui,sans-serif;background:#fff}
#zone{position:fixed;left:240px;top:150px;width:800px;height:450px;border:4px dashed #888;border-radius:24px;
  display:grid;place-items:center;background:#fdf2f8}#zone.over{border-color:#db2777}
canvas{position:fixed;left:0;top:0;width:200px;height:120px}#log{position:fixed;left:40px;top:620px}</style></head>
<body><canvas id="art" width="200" height="120"></canvas><div id="zone">Drop an image here</div><div id="log"></div>
<script type="module">
import { receipt } from './receipt.js';
// A drop zone as image tools have it: only the zone takes a drag (no file input under it), and the page keeps
// animating, each frame busy for a while. Each file dropped on the zone is listed as "dropped NAME SIZE FNV1A"
// (receipt.js), where the accessibility tree shows it.
const zone = document.getElementById('zone');
const log = document.getElementById('log');
zone.addEventListener('dragenter', () => zone.classList.add('over'));
zone.addEventListener('dragleave', () => zone.classList.remove('over'));
zone.addEventListener('dragover', (e) => e.preventDefault());
zone.addEventListener('drop', async (e) => {
  e.preventDefault();
  zone.classList.remove('over');
  for (const file of e.dataTransfer.files) {
    const line = document.createElement('p');
    line.textContent = await receipt(file, 'dropped');
    log.append(line);
  }
});
const art = document.getElementById('art').getContext('2d');
const draw = (t) => {
  const end = performance.now() + 25;
  while (performance.now() < end) art.fillRect(Math.random() * 200, Math.random() * 120, 2, 2);
  art.fillStyle = `hsl(${t / 10 % 360} 70% 60%)`;
  requestAnimationFrame(draw);
};
requestAnimationFrame(draw);
</script></body></html>
