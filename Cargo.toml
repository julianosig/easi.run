[workspace]
resolver = "3"
members = ["admin", "affinity", "agent", "bench", "browser/launch", "controller", "display", "egress", "line", "locale", "protocol", "proxy", "tests"]
exclude = ["third_party"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
debug = "line-tables-only"

# A patched wayland-backend: see third_party/README.md.
[patch.crates-io]
wayland-backend = { path = "third_party/wayland-backend" }
