[workspace]
resolver = "3"
members = ["admin", "affinity", "agent", "bench", "browser/launch", "controller", "display", "egress", "line", "locale", "protocol", "proxy", "tests"]
exclude = ["third_party"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
debug = "line-tables-only"

# The password hash optimized in the dev and test profiles (test inherits dev): unoptimized, every Argon2 hash in
# admin's tests takes seconds. Debug assertions and overflow checks stay on, as opt-level does not change them.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Patched crates: see third_party/README.md.
[patch.crates-io]
wayland-backend = { path = "third_party/wayland-backend" }
wtransport = { path = "third_party/wtransport" }

# The end-to-end tests check every byte of multi-GiB downloads: optimized, they keep pace with the product (debug
# assertions and overflow checks stay on, as opt-level leaves them).
[profile.dev.package.display-tests]
opt-level = 3
