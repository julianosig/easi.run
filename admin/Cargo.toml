[package]
name = "admin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
display-protocol = { path = "../protocol" }
egress = { path = "../egress" }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
line = { path = "../line" }
locale = { path = "../locale" }
rand = "0.9"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
ring = "0.17"
rustix = { version = "1", features = ["fs", "process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "fs"] }
time = { version = "0.3", default-features = false }
tokio-rustls = { version = "0.26", default-features = false }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
webauthn-rs = { version = "0.5.5", default-features = false }
wtransport = { version = "0.7.2", default-features = false, features = ["ring", "quinn"] }
zeroize = "1"

[dev-dependencies]
aho-corasick = "1"
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
