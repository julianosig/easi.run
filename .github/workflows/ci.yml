name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces its run. Each push to main is a group of its own (a shared group would still
# drop a pending run when a third push queued), so every commit there gets a finished result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, test, licenses
    runs-on: ubuntu-24.04
    # A cold run builds the development image and the whole workspace; a hung test fails here, not at six hours.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The development image (its layers written to the cache from this job, on main's pushes) and this job's build
      # output.
      - id: dev
        uses: ./.github/actions/dev
        with:
          job: check
          write-image: true
      # Every check, in the same development image contributors use (scripts/dev/Dockerfile).
      - run: scripts/dev/run.sh scripts/check.sh --all
        env:
          EASI_DEV_IMAGE: easi-run/dev:ci
      - if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/dev
          key: ${{ steps.dev.outputs.key }}

  images:
    name: Build every image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      week: ${{ steps.cache.outputs.week }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: |
            image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      # Every image Compose builds, as `docker compose build` builds them, with their layers in the GitHub Actions
      # cache: a scope for each (one would overwrite another's), written by main's pushes and read by every run. The
      # scopes change each week, so what the images install from Debian (which the licence report below reads) is at
      # most a week older than a fresh build's. The two images with Google Chrome, the browser and the baseline, write
      # no cache: any run, a pull request's included, can read main's cache, and Google's terms let no one else ship
      # Chrome. The browser reads the admin's, for the Rust build they share.
      - id: cache
        run: |
          week=$(date -u +%G-%V)
          echo "week=$week" >> "$GITHUB_OUTPUT"
          # Bake's own names for the services' builds (a dot in a service's name becomes an underscore).
          definition=$(docker buildx bake -f compose.yaml -f compose.bench.yaml --print)
          {
            echo 'set<<EOF'
            for image in $(echo "$definition" | jq -r '.target | keys[]'); do
              case "$image" in
                browser-image) echo "$image.cache-from=type=gha,scope=images-$week-admin" ;;
                baseline) ;;
                *)
                  echo "$image.cache-from=type=gha,scope=images-$week-$image"
                  if [ "$GITHUB_EVENT_NAME" = push ]; then
                    echo "$image.cache-to=type=gha,scope=images-$week-$image,mode=max"
                  fi
                  ;;
              esac
            done
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          source: .
          files: |
            compose.yaml
            compose.bench.yaml
          load: true
          set: ${{ steps.cache.outputs.set }}
      # Every runtime image carries the notices its contents require (scripts/notices.py).
      - run: |
          for role in display browser agent proxy admin controller; do
            python3 scripts/notices.py image "easi-run-bench/$role:dev" "$role"
          done
      # The licence report from the images just built rather than the committed SBOMs: a package an image now ships
      # with a GPL term fails here until it is classified (scripts/licenses.py).
      - run: scripts/sbom.sh
      # The public demo's installation parses: its Compose file, and its nginx configuration with a throwaway
      # certificate from its own script, mounted as the sites service mounts it.
      - name: Check the demo's configuration
        run: |
          export HOME="$RUNNER_TEMP"
          docker compose -f compose.yaml -f demo/compose.yaml config -q
          demo/sites-cert.sh
          certs="$HOME/.config/easi-run/demo-sites"
          image=$(docker compose -f compose.yaml -f demo/compose.yaml config --format json | jq -r .services.sites.image)
          docker run --rm --network none --read-only --tmpfs /tmp -v "$PWD/demo/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$certs/cert.pem:/etc/demo/cert.pem:ro" -v "$certs/key.pem:/etc/demo/key.pem:ro" "$image" nginx -t

  # The runtime images, published to GHCR for install.sh, which pulls them by digest (scripts/pin.py pins them): on
  # main's pushes to the public repository only, once the checks, the images and the controller's tests pass. They are
  # built from compose.yaml (the production admin, which the images job's bench build is not), reading the images
  # job's cache and writing none, with the browser as its base, which carries no Chrome, checked before anything is
  # pushed. Each is tagged with the commit and labelled with it, the repository and its package. This job alone may
  # write packages, and it runs no test.
  publish:
    name: Publish the images
    if: github.event_name == 'push' && github.repository == 'julianosig/easi.run'
    needs: [check, images, controller]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      # The images published, each a role's.
      ROLES: admin controller display agent proxy browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: |
            image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - id: images
        env:
          WEEK: ${{ needs.images.outputs.week }}
        run: |
          registry=ghcr.io/${GITHUB_REPOSITORY_OWNER}/easi.run
          {
            echo 'set<<EOF'
            echo 'browser-image.target=browser-base'
            echo "browser-image.cache-from=type=gha,scope=images-$WEEK-admin"
            for image in admin controller display-image agent-image proxy-image browser-image; do
              role=${image%-image}
              [ "$image" = browser-image ] || echo "$image.cache-from=type=gha,scope=images-$WEEK-$image"
              echo "$image.tags=$registry-$role:$GITHUB_SHA"
              echo "$image.labels.org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
              echo "$image.labels.org.opencontainers.image.revision=$GITHUB_SHA"
              echo "$image.labels.org.opencontainers.image.title=easi.run-$role"
              echo "$image.args.SOURCE_REVISION=$GITHUB_SHA"
            done
            echo EOF
          } >> "$GITHUB_OUTPUT"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          source: .
          files: compose.yaml
          targets: admin,controller,display-image,agent-image,proxy-image,browser-image
          load: true
          set: ${{ steps.images.outputs.set }}
      # The browser image is one layer (FROM scratch, its file system copied whole): its listing is everything it
      # holds. Nothing of Google Chrome may be there: no file of its package, none of its install scripts' (its icons,
      # its repository's key), and no entry in the package database.
      - name: Check the browser image carries no Chrome
        env:
          IMAGE: ${{ steps.images.outputs.registry }}-browser:${{ github.sha }}
        run: |
          test "$(docker image inspect --format '{{len .RootFS.Layers}}' "$IMAGE")" = 1
          container=$(docker create "$IMAGE")
          docker export "$container" > "$RUNNER_TEMP/browser.tar"
          docker rm "$container"
          tar -tf "$RUNNER_TEMP/browser.tar" > "$RUNNER_TEMP/browser.files"
          tar -xOf "$RUNNER_TEMP/browser.tar" var/lib/dpkg/status > "$RUNNER_TEMP/browser.status"
          test "$(grep -c '^usr/local/bin/browser-launch$' "$RUNNER_TEMP/browser.files")" = 1
          test "$(grep -c '^Package: ' "$RUNNER_TEMP/browser.status")" -gt 100
          test "$(grep -ciE 'google-chrome|^opt/google|^etc/cron.daily/google' "$RUNNER_TEMP/browser.files")" = 0
          test "$(grep -c '^Package: google-chrome' "$RUNNER_TEMP/browser.status")" = 0
      # Each carries the notices its contents require, its SOURCE naming the commit (scripts/notices.py).
      - name: Check the images' notices
        env:
          REGISTRY: ${{ steps.images.outputs.registry }}
        run: |
          for role in $ROLES; do
            python3 scripts/notices.py image "$REGISTRY-$role:$GITHUB_SHA" "$role" "$GITHUB_SHA"
          done
      # Each image pushed under the commit's tag, and its digest in the run's summary, as scripts/pin.py reads it.
      - name: Push the images
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REGISTRY: ${{ steps.images.outputs.registry }}
        run: |
          printf '%s\n' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # At once, each waited for: the step takes the largest image's push, not the sum.
          pushes=()
          for role in $ROLES; do
            docker push --quiet "$REGISTRY-$role:$GITHUB_SHA" &
            pushes+=("$!")
          done
          for push in "${pushes[@]}"; do wait "$push"; done
          {
            echo "### Images of $GITHUB_SHA"
            echo '```'
            for role in $ROLES; do
              docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$REGISTRY-$role:$GITHUB_SHA" |
                grep "^$REGISTRY-$role@"
            done
            echo '```'
            echo "Then, in the private repository: scripts/pin.py $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io

  # The controller's session lifecycle against the runner's Docker Engine. It needs no bench stack and none of the
  # images job's images (it builds stand-ins with the engine's own builder), so it runs beside that job.
  controller:
    name: Test the controller against Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo test --locked -p controller --test docker -- --ignored

  # main's line coverage (scripts/coverage.sh), for the README's badge: on pushes, which run on main only. It runs the
  # repository's code, so it holds only the workflow's read access; the job publishing its result runs none.
  coverage:
    name: Measure coverage
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      badge: ${{ steps.measure.outputs.badge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The development image (the check job writes its layers) and this job's build output.
      - id: dev
        uses: ./.github/actions/dev
        with:
          job: coverage
      - id: measure
        env:
          EASI_DEV_IMAGE: easi-run/dev:ci
        run: |
          scripts/dev/run.sh scripts/coverage.sh
          echo "badge=$(cat target/coverage/coverage.json)" >> "$GITHUB_OUTPUT"
      # The job runs on pushes alone.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/dev
          key: ${{ steps.dev.outputs.key }}

  # Publishes coverage.json as the only file of the badges branch, one commit force-pushed, which the README's
  # shields.io endpoint badge reads. Without a concurrency group (a newer push would cancel a pending run's job, and
  # every commit on main gets a finished result): a run whose commit main has moved on from leaves the badge to the
  # newer run, and a race never fails the run.
  badge:
    name: Publish the coverage badge
    needs: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          BADGE: ${{ needs.coverage.outputs.badge }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          printf '%s\n' "$BADGE" | jq -e '.schemaVersion == 1 and .label == "coverage"
            and (.message | test("^[0-9]{1,3}%$")) and (.color | test("^[a-z]+$"))' >/dev/null
          git init -q -b badges "$RUNNER_TEMP/badges"
          cd "$RUNNER_TEMP/badges"
          printf '%s\n' "$BADGE" > coverage.json
          git add coverage.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Coverage of $GITHUB_SHA"
          # The branch is read before main is checked, and pushed over only as read: an older run that passed its own
          # check pushing in between fails the lease and is pushed over next time, and a newer one's push fails it too,
          # after which main has moved on.
          for attempt in 1 2 3; do
            tip=$(git ls-remote "$remote" refs/heads/badges | cut -f1)
            if [ "$(git ls-remote "$remote" refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]; then
              echo "main has moved on from $GITHUB_SHA: its newer run publishes the badge"
              exit 0
            fi
            if git push -q --force-with-lease="refs/heads/badges:$tip" "$remote" HEAD:refs/heads/badges; then
              exit 0
            fi
            echo "attempt $attempt: the badges branch changed while publishing"
          done
          echo "::warning::the badges branch kept changing; the badge stays as another run published it"
