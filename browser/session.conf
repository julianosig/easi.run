<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The browser's session bus: only the browser and the agent may connect. -->
<busconfig>
  <type>session</type>
  <listen>unix:path=/run/browser/bus/session</listen>
  <auth>EXTERNAL</auth>
  <servicedir>/usr/share/dbus-1/services</servicedir>
  <policy context="default">
    <allow user="browser"/>
    <allow user="agent"/>
    <allow send_destination="*" eavesdrop="false"/>
    <allow receive_type="method_call"/>
    <allow receive_type="method_return"/>
    <allow receive_type="error"/>
    <allow receive_type="signal"/>
    <allow own="*"/>
    <!-- The file chooser portal is the launcher's: only the browser's uid may own it or call it (the launcher also
         checks each caller is a process of Chromium's, since the DevTools agent shares that uid). -->
    <deny own="org.freedesktop.portal.Desktop"/>
    <deny send_destination="org.freedesktop.portal.Desktop"/>
  </policy>
  <policy user="browser">
    <allow own="org.freedesktop.portal.Desktop"/>
    <allow send_destination="org.freedesktop.portal.Desktop"/>
  </policy>
  <limit name="max_connections_per_user">64</limit>
  <limit name="max_completed_connections">128</limit>
  <limit name="max_message_size">33554432</limit>
</busconfig>
