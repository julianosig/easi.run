[package]
name = "browser-launch"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
affinity = { path = "../../affinity" }
display-protocol = { path = "../../protocol" }
locale = { path = "../../locale" }
rustix = { version = "1", features = ["event", "fs", "net", "pipe", "process", "thread"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
wayland-client = "0.31"
wayland-scanner = "0.31"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[lints]
workspace = true
