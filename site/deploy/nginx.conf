# easi.run's static site behind its Cloudflare tunnel. Runs unprivileged on a read-only root: everything writable lives
# in /tmp. The tunnel reaches it over plain HTTP; HTTPS is enforced at Cloudflare's edge.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  # Each request's time, page, status, referrer and user agent, to the container's log, to tell which links bring
  # visits and installs (GET /install.md); no address is kept.
  log_format visits '$time_iso8601 "$request" $status "$http_referer" "$http_user_agent"';
  access_log /dev/stdout visits;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Any other host name gets nothing.
  server {
    listen 8080 default_server;
    return 404;
  }

  server {
    listen 8080;
    server_name www.easi.run;
    return 301 https://easi.run$request_uri;
  }

  server {
    listen 8080;
    server_name easi.run;
    root /srv/current;

    # Hashed build assets never change. They come from a pool shared by every kept release, so a page loaded before a
    # switch still finds its files. Only successful responses are cached; a missing file is never stored.
    location /assets/ {
      root /srv/pool;
      include /etc/nginx/easi/headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
      error_page 404 = @missing;
    }
    location @missing {
      include /etc/nginx/easi/headers.conf;
      add_header Cache-Control "no-store" always;
      return 404;
    }

    # The link previews' cards: each name carries a hash of its pixels (site/scripts/cards.mjs), so it never changes,
    # and every card ever published stays in the pool (release.sh), for the posts that name it.
    location /og/ {
      root /srv/pool;
      include /etc/nginx/easi/headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # The installer, and its instructions for agents: read as text, and always the latest.
    location = /install.sh {
      include /etc/nginx/easi/headers.conf;
      add_header Cache-Control "no-cache" always;
      types { }
      default_type text/plain;
      charset utf-8;
      try_files $uri =404;
    }
    location = /install.md {
      include /etc/nginx/easi/headers.conf;
      add_header Cache-Control "no-cache" always;
      types { }
      default_type text/markdown;
      charset utf-8;
      charset_types text/markdown;
      try_files $uri =404;
    }

    # The documentation lives on its own host: /docs, and anything under /docs/, go there.
    location ~ ^/docs(/|$) {
      include /etc/nginx/easi/headers.conf;
      return 301 https://docs.easi.run/;
    }

    # Each language's page has one address, /<locale>/ (English's is /): the same without its slash, or naming
    # index.html, goes there. The languages are i18n/locales.ts's.
    location ~ ^/(pt-BR|es|zh-CN|hi|fr|de|ja|ru|id|ko)(/index\.html)?$ {
      include /etc/nginx/easi/headers.conf;
      return 301 https://easi.run/$1/$is_args$args;
    }
    location = /index.html {
      include /etc/nginx/easi/headers.conf;
      return 301 https://easi.run/$is_args$args;
    }
    # Each page past the first has one address in each language, /<page>/ and /<locale>/<page>/: the same without its
    # slash, or naming index.html, goes there. The pages are site/src/lib/site.ts's PAGES.
    location ~ ^/(features|compare)(/index\.html)?$ {
      include /etc/nginx/easi/headers.conf;
      return 301 https://easi.run/$1/$is_args$args;
    }
    location ~ ^/(pt-BR|es|zh-CN|hi|fr|de|ja|ru|id|ko)/(features|compare)(/index\.html)?$ {
      include /etc/nginx/easi/headers.conf;
      return 301 https://easi.run/$1/$2/$is_args$args;
    }

    # Pages and other files revalidate; unknown paths are 404s, not the landing page.
    location / {
      include /etc/nginx/easi/headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/index.html =404;
    }
  }

  # The documentation: the same release, its own page at /, the same asset pool.
  server {
    listen 8080;
    server_name docs.easi.run;
    root /srv/current;

    location /assets/ {
      root /srv/pool;
      include /etc/nginx/easi/headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
      error_page 404 = @missing;
    }
    location @missing {
      include /etc/nginx/easi/headers.conf;
      add_header Cache-Control "no-store" always;
      return 404;
    }
    location = / {
      include /etc/nginx/easi/headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files /docs/index.html =404;
    }
    # Each language's docs, /<locale>/ (English's are /): the same page, which reads its language from the address; the
    # same without its slash goes there. The languages are i18n/locales.ts's.
    location ~ ^/(pt-BR|es|zh-CN|hi|fr|de|ja|ru|id|ko)/$ {
      include /etc/nginx/easi/headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files /docs/index.html =404;
    }
    location ~ ^/(pt-BR|es|zh-CN|hi|fr|de|ja|ru|id|ko)$ {
      include /etc/nginx/easi/headers.conf;
      return 301 https://docs.easi.run/$1/$is_args$args;
    }
    location ~ ^/(favicon\.svg|favicon\.ico|apple-touch-icon\.png)$ {
      include /etc/nginx/easi/headers.conf;
      add_header Cache-Control "no-cache" always;
    }
    location / {
      include /etc/nginx/easi/headers.conf;
      add_header Cache-Control "no-store" always;
      return 404;
    }
  }
}
