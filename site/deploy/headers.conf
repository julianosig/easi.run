# Security headers for every response from easi.run and docs.easi.run. nginx drops inherited add_header lines in any
# block that adds its own, so each location includes this file next to its Cache-Control. The build inlines its
# smallest fonts as data: URLs. No page needs inline styles: the scripts set styles through the CSSOM, which style-src
# leaves alone. The live demo shares easi.run's origin (under /demo/, with its /api/, /ws/ and /sdk/), so a script on
# these pages could act as a demo visitor: only the site's own scripts run here, nothing third-party.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.github.com; frame-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The hero frames the live demo, which may use the clipboard, sound, and (to record) the camera and microphone.
add_header Permissions-Policy "clipboard-write=(self), clipboard-read=(self), camera=(self), microphone=(self), autoplay=(self), fullscreen=(self), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
