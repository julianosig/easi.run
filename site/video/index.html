<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The film's stage (scripts/film.mjs), served only by the development server: never part of the site's build. -->

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&family=Noto+Sans+SC:wght@700&family=Noto+Sans+KR:wght@700&family=Noto+Sans+Devanagari:wght@500;600&display=block"
    />
  </head>
  <body style="margin: 0">
    <div id="app"></div>
    <script type="module" src="/src/video/main.ts"></script>
  </body>
</html>
