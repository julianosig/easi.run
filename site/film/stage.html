<!doctype html>
<html lang="__LANG__"><head><meta charset="utf-8">
<style>
@font-face{font-family:'IS';src:url(fonts/instrument-sans-latin-wght-normal.woff2) format('woff2');font-weight:400 700}
@font-face{font-family:'GM';src:url(fonts/geist-mono-latin-wght-normal.woff2) format('woff2');font-weight:100 900}
:root{--fair:#d29922;--paper:#151e2e;--wash:#0e1522;--ink:#e8edf5;--muted:#a7b4c8;--line:#2c3a52;--accent:#4f81ff;--strong:#7aa0ff;--soft:#1c2a48;--you:#f06445;--bad:#ef5f5f;--good:#3fb950;--void:#0a101c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--void);font-family:'IS',sans-serif;color:var(--ink)}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--void)}
.glow{position:absolute;width:1500px;height:1500px;border-radius:50%;background:radial-gradient(circle,#4f81ff30,transparent 62%)}
.glow.y{background:radial-gradient(circle,#f0644518,transparent 62%)}
#dust{position:absolute;inset:0}
.d{position:absolute;border-radius:50%;background:#a7b4c8}
#view{position:absolute;inset:0;perspective:2000px;overflow:hidden}
#world{position:absolute;left:0;top:0;transform-style:preserve-3d;will-change:transform}
.st{position:absolute;left:0;top:0;width:1000px;height:760px;transform-style:preserve-3d;will-change:transform,opacity}
.win{position:absolute;border-radius:20px;background:var(--paper);border:1px solid var(--line);box-shadow:0 50px 110px #000b;overflow:hidden}
.bar{height:52px;background:var(--wash);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:0 18px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.url{flex:1;height:30px;margin-left:12px;border-radius:15px;background:var(--paper);border:1px solid var(--line);color:var(--muted);font-size:15px;display:flex;align-items:center;padding:0 16px}
.pg{position:absolute;left:0;right:0;top:52px;bottom:0;overflow:hidden;background:#f3f6fb;color:#14284b}
.hero{height:44%;background:linear-gradient(120deg,#3f8fb0,#2a6d8f 60%,#245e70)}
.card{position:absolute;border-radius:13px;background:#fff;box-shadow:0 8px 24px #14284b22}
.sheen{position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,#ffffff55 50%,transparent 60%);pointer-events:none;z-index:7;transform:translateX(-120%)}
.cur{position:absolute;width:48px;height:48px;left:0;top:0;filter:drop-shadow(0 8px 12px #000a);z-index:9}
.rip{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;border:3px solid currentColor;opacity:0;z-index:8}
.chip{position:absolute;display:inline-flex;align-items:center;gap:13px;padding:13px 26px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:28px;font-weight:600;white-space:nowrap;box-shadow:0 22px 50px #000a}
.mono{font-family:'GM',monospace}
.rack{position:absolute;height:120px;border-radius:16px;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 30px;box-shadow:0 30px 70px #0009}
.led{width:14px;height:14px;border-radius:50%;background:var(--good);box-shadow:0 0 14px var(--good)}
.slot{flex:1;height:12px;border-radius:6px;background:var(--line)}
.term{position:absolute;background:#0a101cdd;border-left:1px solid var(--line);font-family:'GM',monospace;color:var(--ink);overflow:hidden}
.num{font-weight:700;letter-spacing:-.05em;line-height:.95}
.row{position:absolute;left:0;right:0;display:flex;align-items:center;gap:18px;padding:0 26px;font-size:24px;border-bottom:1px solid var(--line)}
.ico{width:15px;height:15px;border-radius:50%;flex:none}
#scrim{position:absolute;top:0;bottom:0;width:1100px;background:linear-gradient(90deg,#0a101cf2 58%,transparent)}
#read{position:absolute;left:0;top:0;bottom:0;width:1920px}
.part{position:absolute;width:740px;font-weight:500;letter-spacing:-.022em;will-change:transform,opacity,filter}
.w{display:inline-block;position:relative;margin-right:.26em;transform-origin:50% 80%;will-change:transform,opacity}
.w .t{position:relative;z-index:1}
.w .mk{position:absolute;left:-.1em;right:-.1em;top:.1em;bottom:-.02em;border-radius:.16em;background:#4f81ff3d;transform-origin:0 50%;z-index:0}
.w .mk.y{background:#f0644540}
.lw{position:absolute;left:19%;top:9%;width:100%;height:100%;margin:-50% 0 0 -50%;border-radius:50%;border:var(--bw,.07em) solid #f06445;opacity:0;pointer-events:none}
.w .lfx{margin-right:.2em}
#bar{position:absolute;left:0;bottom:0;height:5px;width:100%;background:var(--accent);transform-origin:0 50%;box-shadow:0 0 18px var(--accent)}
#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;opacity:0;background:radial-gradient(circle at 50% 45%,#121c30,var(--void) 70%)}
</style></head>
<body><div id="stage"><div class="glow" id="g1"></div><div class="glow y" id="g2"></div><div id="dust"></div>
<div id="view"><div id="world"></div></div><div id="scrim"></div><div id="read"></div><div id="bar"></div>
<div id="end"><div style="display:flex;align-items:center;gap:40px" id="lg"><span style="width:220px;height:220px;display:inline-block" id="ll"></span><span style="font-weight:700;font-size:200px;letter-spacing:-.05em">easi<span style="color:var(--you)">.</span>run</span></div><div id="e1" style="font-size:54px;font-weight:600">Install with one prompt</div><div id="e2" style="font-size:40px;color:var(--muted)">Open source</div></div>
</div>
<script>
const T=__TIMING__;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const out=x=>1-Math.pow(1-x,4);
const inout=x=>x<.5?8*x*x*x*x:1-Math.pow(-2*x+2,4)/2;
const expo=x=>x>=1?1:1-Math.pow(2,-10*x);
const back=x=>{const c=1.25;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const $=id=>document.getElementById(id);
const q=(e,s)=>e.querySelector(s);const qa=(e,s)=>[...e.querySelectorAll(s)];
const CUR=c=>`<svg viewBox="0 0 64 64"><path d="M12 6 56 30 35 36 25 58Z" fill="${c}" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/></svg>`;
const LOGO=`<svg viewBox="0 0 64 64" width="100%" height="100%"><path d="M12 6 56 30 35 36 25 58Z" fill="#4f81ff" stroke="#4f81ff" stroke-width="3.5" stroke-linejoin="round"/><circle cx="51" cy="51" r="6.5" fill="#f06445"/></svg>`;
const LOGOFX=sz=>`<span class="lfx" style="position:relative;display:inline-block;width:${sz};height:${sz};vertical-align:-.08em"><span class="lc" style="position:absolute;inset:0;display:block;transform-origin:19% 9%">${LOGO}</span>${[0,1,2].map(()=>'<span class="lw"></span>').join('')}</span>`;
const logoFx=(el,d,loop=0)=>{if(!el)return;const dd=loop&&d>0?d%loop:d;const o=out(seg(d,-.4,0));const pr=dd>0&&dd<.3?Math.sin(dd/.3*Math.PI):0;q(el,'.lc').style.transform=`translate(${(1-o)*28}%,${(1-o)*28}%) scale(${1-.14*pr})`;qa(el,'.lw').forEach((w,i)=>{const x=dd-.1-i*.17,k=seg(x,0,.95);w.style.opacity=(x>0&&k<1)?(1-k)*.95:0;w.style.transform=`scale(${lerp(.1,2.7,out(k))})`})};
$('ll').innerHTML=LOGOFX('220px');$('ll').style.setProperty('--bw','7px');
const win=(url,body,style='',cls='')=>`<div class="win ${cls}" style="${style}"><div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url">${url}</span></div><div class="pg">${body}</div><div class="sheen"></div></div>`;
const page=()=>`<div class="hero"></div><div class="card" style="left:6%;right:6%;top:36%;height:18%"></div>${[0,1,2,3].map(i=>`<div class="card" style="left:${6+i*22.4}%;width:20%;top:60%;height:34%;background:linear-gradient(135deg,${['#f3a97e,#d9654a','#8ccdb9,#3b8e7a','#a9b7ea,#5e72c8','#ecd27c,#c49527'][i]})"></div>`).join('')}`;
const cur=(c='#4f81ff',k='')=>`<div class="cur ${k}">${CUR(c)}</div>`;
const rip=(c='#4f81ff',k='')=>`<div class="rip ${k}" style="color:${c}"></div>`;
const at=(c,x,y,r=0)=>{c.style.transform=`translate3d(${x}px,${y}px,60px) rotate(${r}deg)`};
const ripple=(r,x,y,p,p0,d=.12)=>{const k=seg(p,p0,p0+d);r.style.left=x+'px';r.style.top=y+'px';r.style.opacity=(k>0&&k<1)?(1-k):0;r.style.transform=`translateZ(60px) scale(${lerp(.2,1.6,out(k))})`};
const arc=(a,b,p,lift=70)=>{const e=inout(p);return [lerp(a[0],b[0],e),lerp(a[1],b[1],e)-Math.sin(e*Math.PI)*lift]};
const sheen=(w,p,a)=>{const s=q(w,'.sheen');if(s)s.style.transform=`translateX(${lerp(-110,110,seg(p,a,a+.25))}%)`};
const pop=(e,p,a,d,fromZ=160)=>{const k=back(seg(p,a,a+d));e.style.opacity=seg(p,a,a+d*.4);e.style.transform=`translateZ(${lerp(fromZ,40,k)}px) scale(${lerp(.82,1,k)})`};
const S=[];
function add(html,fn){const d=document.createElement('div');d.className='st';d.innerHTML=html;$('world').append(d);S.push({el:d,fn})}
// Q1 logged out, again and again
{const toast=(t,i)=>`<div class="chip ts" style="left:${600-i*36}px;top:${440+i*86}px;font-size:28px;border-color:var(--fair);color:var(--fair)"><span class="ico" style="background:var(--fair)"></span>${t}</div>`;
add(win('mail.example',`<div class="hero" style="height:100%;background:linear-gradient(135deg,#c9d3e6,#e8edf6);filter:blur(3px)"></div><div class="card md" style="left:18%;right:18%;top:16%;bottom:16%;padding:40px;text-align:center"><div style="font-size:40px;font-weight:700;color:#14284b">You've been signed out</div><div style="font-size:24px;color:#5b6b85;margin-top:14px">Your session expired.</div><div style="margin:34px auto 0;width:300px;height:62px;border-radius:12px;background:#d93b3b;color:#fff;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center">Sign in again</div></div>`,'left:0;top:40px;width:860px;height:560px','w1')+['Signed out','Signed out again','Session expired'].map(toast).join(''),
(e,p)=>{const w=q(e,'.w1'),k=expo(seg(p,0,.2));w.style.opacity=seg(p,0,.08);w.style.transform=`translateZ(${lerp(-300,0,k)}px)`;const m=q(e,'.md'),b=back(seg(p,.08,.24));m.style.transform=`scale(${lerp(.6,1,b)}) translateX(${Math.sin(p*120)*(1-seg(p,.24,.34))*(p>.2?12:0)}px)`;m.style.opacity=seg(p,.08,.14);qa(e,'.ts').forEach((t,i)=>{const a=.34+i*.16;pop(t,p,a,.1,260);t.style.transform+=` translateX(${Math.sin(p*140+i)*(1-seg(p,a+.06,a+.14))*(p>a?14:0)}px)`})})}
// Q2 a code on your phone, are you human
add(`<div class="ph2" style="position:absolute;left:30px;top:30px;width:300px;height:620px;border-radius:46px;background:#0e1522;border:8px solid #2c3a52;box-shadow:0 50px 110px #000b;overflow:hidden"><div style="height:30px;width:120px;margin:12px auto;border-radius:15px;background:#2c3a52"></div><div class="sms" style="margin:40px 18px 0;padding:20px;border-radius:22px;background:#1c2a48;font-size:22px;line-height:1.4"><div style="color:var(--muted);font-size:17px">Messages · now</div>Your sign-in code is<div class="mono" style="font-size:38px;font-weight:700;color:var(--fair);margin-top:6px">482 913</div></div></div><div class="win cp2" style="left:390px;top:180px;width:600px;height:250px;padding:40px;border-color:var(--bad)"><div style="display:flex;align-items:center;gap:26px"><span class="bx2" style="width:64px;height:64px;border-radius:12px;border:5px solid var(--bad);display:inline-flex;align-items:center;justify-content:center"><span class="spin" style="width:34px;height:34px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--bad)"></span></span><span style="font-size:46px;font-weight:700;color:var(--bad)">Are you human?</span></div><div style="font-size:25px;color:var(--muted);margin-top:22px">Verify to continue. Try again.</div></div>`+cur(),
(e,p)=>{const f=q(e,'.ph2'),k=expo(seg(p,0,.2));f.style.opacity=seg(p,0,.08);f.style.transform=`translate3d(0,${(1-k)*300}px,40px) rotate(${(1-k)*-8}deg)`;const s=q(e,'.sms'),b=back(seg(p,.12,.26));s.style.opacity=seg(p,.12,.16);s.style.transform=`scale(${lerp(.6,1,b)})`;const c=q(e,'.cp2');pop(c,p,.4,.12,300);q(e,'.spin').style.transform=`rotate(${p*2400}deg)`;c.style.transform+=` translateX(${Math.sin(p*150)*(p>.62&&p<.74?12:0)}px)`;const u=q(e,'.cur');u.style.opacity=seg(p,.46,.5);const [x,y]=arc([900,650],[455,250],seg(p,.48,.62),40);at(u,x+(p>.62?Math.sin(p*90)*8:0),y)})
// Q3 it takes your screen, stops with the lid
add(`<div class="lap" style="position:absolute;left:150px;top:60px;width:700px;height:560px;transform-style:preserve-3d"><div style="position:absolute;left:0;top:470px;width:700px;height:34px;border-radius:0 0 24px 24px;background:#2c3a52"></div><div class="lid" style="position:absolute;left:28px;top:40px;width:644px;height:432px;border-radius:18px 18px 0 0;background:#1c2a48;border:8px solid #2c3a52;transform-origin:50% 100%;overflow:hidden">${page()}</div></div>`+cur('#4f81ff','ag')+`<div class="chip tk3" style="left:520px;top:0;font-size:30px;border-color:var(--fair);color:var(--fair)">Your mouse, taken</div><div class="chip stp" style="left:330px;top:640px;font-size:34px;background:var(--bad);border-color:var(--bad);color:#fff"><span class="ico" style="background:#fff"></span>Agent stopped</div>`,
(e,p)=>{const l=q(e,'.lap'),k=expo(seg(p,0,.18));l.style.opacity=seg(p,0,.08);l.style.transform=`translateZ(${lerp(-300,0,k)}px)`;const a=q(e,'.ag');a.style.opacity=seg(p,.06,.1)*(1-seg(p,.56,.6));const s=p*16;at(a,480+Math.sin(s)*220+Math.sin(s*3.1)*60,280+Math.cos(s*1.3)*140,Math.sin(s*2)*20);pop(q(e,'.tk3'),p,.16,.1);const d=inout(seg(p,.5,.72));q(e,'.lid').style.transform=`rotateX(${-d*88}deg)`;pop(q(e,'.stp'),p,.72,.12,300)})
// Q4 hand it your passwords
add(`<div class="win pw4" style="left:0;top:140px;width:520px;height:300px;padding:40px"><div style="font-size:26px;color:var(--muted);font-weight:600">Password</div><div class="mono pd" style="margin-top:20px;height:86px;border-radius:14px;background:var(--wash);border:2px solid var(--line);font-size:44px;display:flex;align-items:center;padding:0 24px;letter-spacing:.1em"></div></div><div class="key" style="position:absolute;left:0;top:0;width:90px;height:90px"><svg viewBox="0 0 24 24" width="90" height="90" fill="none" stroke="#d29922" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3M16 7l3 3M14 9l2 2"/></svg></div><div class="win ag4" style="left:620px;top:160px;width:380px;height:260px;padding:34px;border-color:var(--strong)"><div style="display:flex;gap:16px;align-items:center;font-size:32px;font-weight:700"><span style="width:44px;height:44px">${CUR('#4f81ff')}</span>Your agent</div><div class="hold mono" style="font-size:24px;color:var(--fair);margin-top:24px"></div></div><div class="chip wr" style="left:560px;top:470px;font-size:32px;background:var(--bad);border-color:var(--bad);color:#fff">Your password, shared</div>`,
(e,p)=>{pop(q(e,'.pw4'),p,0,.14);const d=q(e,'.pd'),n=Math.floor(seg(p,.08,.34)*11);d.textContent='•'.repeat(n);pop(q(e,'.ag4'),p,.18,.12);const k=q(e,'.key'),v=seg(p,.4,.62),[x,y]=arc([380,250],[780,240],v,140);k.style.opacity=seg(p,.38,.42)*(1-seg(p,.6,.64));k.style.transform=`translate3d(${x}px,${y}px,90px) rotate(${v*360}deg)`;q(e,'.hold').textContent=p>.62?'holds: •••••••••••':'';pop(q(e,'.wr'),p,.68,.12,300);q(e,'.wr').style.transform+=` translateX(${Math.sin(p*150)*(p>.7&&p<.8?10:0)}px)`})
// Q5 when you come back, what did it do
add(`<div class="win lg5" style="left:120px;top:60px;width:620px;height:580px"><div style="height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 30px;font-size:28px;font-weight:700">What your agent did</div>${[0,1,2,3,4].map(i=>`<div class="r5" style="position:absolute;left:30px;right:30px;top:${100+i*90}px;height:62px;border-radius:12px;border:2px dashed var(--line)"></div>`).join('')}<div class="nr" style="position:absolute;left:0;right:0;top:300px;text-align:center;font-size:34px;font-weight:600;color:var(--muted)">No record</div></div><div class="qm" style="position:absolute;left:700px;top:20px;font-size:300px;font-weight:700;color:var(--you);line-height:1">?</div><div class="chip gn" style="left:40px;top:660px;font-size:30px"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#a7b4c8" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>While you were gone · <span class="mono hr">0h 00m</span></div>`,
(e,p)=>{const w=q(e,'.lg5'),k=expo(seg(p,0,.2));w.style.opacity=seg(p,0,.08);w.style.transform=`translateZ(${lerp(-300,0,k)}px) rotate(${(1-k)*-4}deg)`;qa(e,'.r5').forEach((r,i)=>{r.style.opacity=seg(p,.06+i*.04,.12+i*.04)*(1-seg(p,.5,.6)*.6)});q(e,'.nr').style.opacity=seg(p,.5,.6);pop(q(e,'.gn'),p,.14,.1);const m=Math.floor(out(seg(p,.16,.5))*192);q(e,'.hr').textContent=`${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m`;const qm=q(e,'.qm'),b=back(seg(p,.6,.76));qm.style.opacity=seg(p,.6,.64);qm.style.transform=`translateZ(120px) scale(${lerp(.3,1,b)}) rotate(${(1-b)*-30+Math.sin(p*8)*4}deg)`})
// 1 a real Chrome from your server
add(win('wayfare.example/flights',page(),'left:70px;top:0;width:860px;height:520px')+`<div class="rack" style="left:210px;top:600px;width:580px"><span class="led"></span><span class="led" style="background:var(--strong);box-shadow:0 0 14px var(--strong)"></span><span class="slot"></span><span class="slot"></span><span class="slot"></span></div><svg style="position:absolute;left:490px;top:515px" width="20" height="90"><path class="ln" d="M10 90V0" stroke="#4f81ff" stroke-width="4" stroke-dasharray="90" fill="none"/></svg>`+cur()+rip()+`<div class="chip og" style="left:540px;top:380px;font-size:30px"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>An ordinary browser</div>`,
(e,p)=>{const w=q(e,'.win'),k=expo(seg(p,.02,.32));w.style.transform=`translateY(${(1-k)*320}px) translateZ(${lerp(-500,0,k)}px) scale(${lerp(.45,1,k)})`;w.style.opacity=seg(p,.02,.12);q(e,'.rack').style.transform=`translateZ(40px) translateY(${(1-out(seg(p,0,.2)))*160}px)`;q(e,'.ln').style.strokeDashoffset=90*(1-seg(p,.1,.3));
 const c=q(e,'.cur');c.style.opacity=seg(p,.34,.4);const [x,y]=arc([830,480],[420,230],seg(p,.36,.62));at(c,x,y);ripple(q(e,'.rip'),430,240,p,.62);pop(q(e,'.og'),p,.72,.14)});
// 2 any MCP client, one line
